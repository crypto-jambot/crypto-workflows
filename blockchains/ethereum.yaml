main:
  params: [args]
  steps:
    - init:
        assign:
          - project: ${sys.get_env("GOOGLE_CLOUD_PROJECT_ID")}
    - invoke_pool_ingestor:
        call: http.post
        args:
          url: https://bigquery-pool-ingestor-o7et2ip22q-uc.a.run.app/
          body:
            - blockchain: ${args.blockchain}
              exchangeName: uniswapV2
              numberOfBlocks: 1000000
              rpcBlockBatchSize: 10000
            - blockchain: ${args.blockchain}
              exchangeName: uniswapV3
              numberOfBlocks: 1000000
              rpcBlockBatchSize: 10000
            - blockchain: ${args.blockchain}
              exchangeName: sushiswap
              numberOfBlocks: 1000000
              rpcBlockBatchSize: 10000
          auth:
            type: OIDC
    - invoke_token_enricher:
        call: http.post
        args:
          url: https://bigquery-token-enricher-o7et2ip22q-uc.a.run.app
          body:
            blockchain: ${args.blockchain}
            numberToProcess: 50000
            chunkSize: 3
          auth:
            type: OIDC
    - invoke_pool_refiner:
        call: LaunchDataflow
        args:
          artifactId: pool-refiner
          bucketName: pool-refiner-dfjob
          dataflowName: App
        result: pool_refiner_job_id
    - wait_until_pool_refiner_done:
        call: DataflowWaitUntilStatus
        args:
          jobId: ${pool_refiner_job_id}
          status: JOB_STATE_DONE
          project: ${project}
    - invoke_path-resolver:
        call: LaunchDataflow
        args:
          artifactId: path-resolver
          bucketName: path-resolver-dfjob
          dataflowName: App
        result: path_resolver_job_id
    - wait_until_path_resolver_done:
        call: DataflowWaitUntilStatus
        args:
          jobId: ${path_resolver_job_id}
          status: JOB_STATE_DONE
          project: ${project}
    - invoke_mongo_loader:
        call: http.post
        args:
          url: https://mongo-loader-o7et2ip22q-uc.a.run.app
          body:
            bucketName: ${args.bucketName}
          auth:
            type: OIDC
    - return_value:
        return: Workflow Success
LaunchDataflow:
  params: [artifactId, bucketName, dataflowName]
  steps:
    - launch:
        call: http.post
        args:
          url: https://us-central1-crypto-351521.cloudfunctions.net/dataflow-deployer-http
          body:
            artifactId: ${artifactId}
            bucketName: ${bucketName}
            dataflowName: ${dataflowName}
          auth:
            type: OIDC
        result: dataflowResponse
    - jobCreated:
        return: ${dataflowResponse.body.id}
DataflowWaitUntilStatus:
  params: [jobId, status, project]
  steps:
    - init:
        assign:
          - currentStatus: ''
          - failureStatuses:
              - JOB_STATE_FAILED
              - JOB_STATE_CANCELLED
              - JOB_STATE_UPDATED
              - JOB_STATE_DRAINED
    - check_condition:
        switch:
          - condition: ${currentStatus in failureStatuses}
            next: exit_fail
          - condition: ${currentStatus != status}
            next: iterate
        next: exit_success
    - iterate:
        steps:
          - sleep30s:
              call: sys.sleep
              args:
                seconds: 30
          - getJobStatus:
              call: http.get
              args:
                url: https://us-central1-crypto-351521.cloudfunctions.net/dataflow-status-check
                headers:
                  id: ${jobId}
                  project: ${project}
                auth:
                  type: OIDC
              result: jobStatus
          - assignStatus:
              assign:
                - currentStatus: ${jobStatus.body.status}
          - log:
              call: sys.log
              args:
                text: '${"Current job status:" + currentStatus}'
                severity: 'INFO'
        next: check_condition
    - exit_success:
        return: ${currentStatus}
    - exit_fail:
        raise: ${"Job in unexpected terminal status " + currentStatus}
